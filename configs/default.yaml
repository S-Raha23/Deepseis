# DeepSeis default configuration
# All paths are relative to the repo root.

seed: 42
device: "cpu"          # "cpu" | "cuda" -- auto-falls-back to cpu if cuda unavailable

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  # Real-data mode: point these at SEG-Y or .npy volumes you provide.
  # Run `python data/download_f3.py` first to fetch the F3 dataset.
  # Set use_synthetic: true to fall back to the built-in synthetic generator
  # (gives a known-clean reference so PSNR/SSIM/Dice can be computed exactly).
  field_volume_path: null   # set to "data/raw/f3/data/train/train_seismic.npy" for real F3 data
  fault_label_path: null
  facies_label_path: null   # set to "data/raw/f3/data/train/train_labels.npy" for real F3 labels
  use_synthetic: false

  synthetic:
    n_traces: 701                # matches F3 Netherlands crossline extent exactly
    n_samples: 255               # matches F3 Netherlands depth samples exactly
    n_layers: 32                 # more layers = denser reflector package, looks like real F3
    n_faults: 8                  # more faults = realistic complexity for a North Sea section
    dt_ms: 4
    wavelet_freq_hz: 30
    random_seed: 7

  noise:
    random_std: 0.6                # incoherent (white) noise std, relative to signal std
    coherent_amp: 0.7               # ground-roll / coherent noise amplitude
    coherent_type: "ground_roll"   # "ground_roll" | "linear" | "none"
    # Deliberately noisy (baseline ~23 dB PSNR): gives the denoiser clear, demonstrable
    # headroom to show improvement within a modest CPU training budget. See README,
    # "Why the demo noise level looks aggressive", for the full rationale and the
    # empirical convergence study behind these numbers.

  patch:
    size: 64
    stride: 32

# ---------------------------------------------------------------------------
# Survey registry -- what the dashboard's "Survey" sidebar selector offers.
#
# Every entry is stored in the SAME canonical layout, so the dashboard treats
# them identically and nothing downstream needs per-survey special-casing:
#   seismic : (n_inlines, n_crosslines, n_samples) float32
#   labels  : (n_inlines, n_crosslines, n_samples) int, facies classes 0..n-1
#
# The per-survey `source_layout` / `source_label_offset` keys below describe how
# the *original publisher's* file deviates from that canonical layout. They are
# consumed once, by the download script, which normalizes on the way in -- they
# are NOT applied again at load time.
# ---------------------------------------------------------------------------
datasets:
  default: f3          # which survey the dashboard opens on

  f3:
    label: "F3 Netherlands"
    region: "Dutch North Sea"
    citation: "Alaudah et al. 2019 · Zenodo 3755060"
    citation_url: "https://zenodo.org/record/3755060"
    geometry: "401 inlines · 701 crosslines · 255 samples"
    dt_ms: 4
    n_facies: 6
    facies_names:
      - "Upper North Sea"
      - "Middle North Sea"
      - "Lower North Sea"
      - "Rijnland/Chalk"
      - "Jurassic"
      - "Triassic"
    # Where this survey's trained checkpoints live. Each survey gets its own,
    # because the denoiser is self-supervised: a model fitted to F3's noise is
    # not the model you want running on another survey.
    run_dir: "runs/default"
    # Runtime source (dashboard): Hugging Face mirror.
    hf_repo: "SRaha23/f3-netherlands"
    hf_seismic: "train_seismic.npy"
    hf_labels: "train_labels.npy"
    # Local source (training): what data/download_f3.py writes.
    local_seismic: "data/raw/f3/data/train/train_seismic.npy"
    local_labels: "data/raw/f3/data/train/train_labels.npy"
    # F3 already ships in canonical layout with 0-indexed labels.
    source_layout: [0, 1, 2]
    source_label_offset: 0

  parihaka:
    label: "Parihaka"
    region: "Taranaki Basin, New Zealand"
    citation: "SEAM/SEG 2020 facies challenge · Mendeley Data 10.17632/gnvyh3msrj.1 (CC BY 4.0)"
    citation_url: "https://data.mendeley.com/datasets/gnvyh3msrj/1"
    geometry: "782 inlines · 590 crosslines · 1006 samples"
    dt_ms: 4
    n_facies: 6
    facies_names:
      - "Basement / Other"
      - "Slope Mudstone A"
      - "Mass Transport Deposit"
      - "Slope Mudstone B"
      - "Slope Valley"
      - "Submarine Canyon System"
    run_dir: "runs/parihaka"
    # Runtime source (dashboard): your own Hugging Face mirror.
    # Create it once with:  python data/mirror_to_hf.py --dataset parihaka
    hf_repo: "SRaha23/parihaka-taranaki"
    hf_seismic: "parihaka_seismic.npy"
    hf_labels: "parihaka_labels.npy"
    # Local source (training): what data/download_parihaka.py writes.
    local_seismic: "data/raw/parihaka/parihaka_seismic.npy"
    local_labels: "data/raw/parihaka/parihaka_labels.npy"
    # The publisher ships (Z, X, Y) = (sample, inline, crossline) with labels
    # numbered 1..6; (1, 2, 0) reorders to canonical and -1 rebases to 0..5.
    source_layout: [1, 2, 0]
    source_label_offset: -1
    source_seismic_url: "https://data.mendeley.com/public-files/datasets/gnvyh3msrj/files/2777ae64-68e3-4cb0-aae4-588b30b7009c/file_downloaded"
    source_labels_url: "https://data.mendeley.com/public-files/datasets/gnvyh3msrj/files/0a0ac0af-10ab-47c3-83ac-f38fb0090d4a/file_downloaded"
    source_seismic_key: "data"      # key inside the published .npz
    source_labels_key: "labels"

# ---------------------------------------------------------------------------
# Blind-spot masking
# ---------------------------------------------------------------------------
masking:
  mode: "auto"                   # "n2v" | "struct_n2v" | "auto" (estimate from data)
  n2v:
    mask_fraction: 0.12           # fraction of pixels masked per patch (higher than the
                                   # ~0.2% textbook default -- compensates for having only
                                   # one small training image instead of a large dataset)
    neighborhood_radius: 5        # radius for the "swap" replacement strategy
  struct_n2v:
    mask_fraction: 0.12
    blind_shape: "trace"          # "trace" (vertical stripe) | "horizontal" | "diagonal"
    blind_width: 3                # width of the blind stripe, in pixels

# ---------------------------------------------------------------------------
# Denoiser model + training
# ---------------------------------------------------------------------------
model:
  denoiser:
    in_channels: 1
    base_channels: 16              # smaller/faster net converges more reliably on a
    depth: 2                       # single-image training set than a larger one does

training:
  epochs: 40                       # empirically plateaus ~epoch 30-40 for this data/network
  batch_size: 16
  lr: 0.001
  weight_decay: 0.00001
  augment_flips: true              # h/v-flip patch augmentation -- ~4x effective training
                                    # patches from one image, meaningfully speeds convergence
  loss:
    lambda_edge: 0.04              # kept modest: higher values (e.g. 0.15) were found to
    lambda_freq: 0.02              # dominate the reconstruction loss and destabilize training
                                    # on this small single-image dataset -- see README.
    freq_highpass_cutoff: 0.55    # fraction of Nyquist above which is "high frequency"
  fault_preservation_enabled: true   # the on/off toggle from the demo script
  log_every: 5
  checkpoint_every: 10             # periodic resumable checkpoint (see --resume)

# ---------------------------------------------------------------------------
# Fault segmentation head (FaultSeg3D-style)
# ---------------------------------------------------------------------------
faultseg:
  pretrained_weights_path: null   # point at real FaultSeg3D weights if you have them
  base_channels: 16
  depth: 3
  train_on_synthetic_if_missing: true
  epochs: 25
  lr: 0.001
  batch_size: 16
  dice_threshold: 0.5

# ---------------------------------------------------------------------------
# Stretch: diffusion refiner
# ---------------------------------------------------------------------------
diffusion:
  enabled: true
  timesteps: 60
  base_channels: 16
  physics_prior_weight: 0.05      # wave-smoothness prior weight
  sample_steps: 20                # DDIM-style sub-sampled inference steps
  epochs: 6

# ---------------------------------------------------------------------------
# Stretch: horizon tracking / facies
# ---------------------------------------------------------------------------
horizon:
  enabled: true
  n_horizons: 4
  smoothness_weight: 0.5

facies:
  enabled: true
  n_classes: 6   # F3 Netherlands has 6 lithostratigraphic facies classes (0-5, Alaudah et al. 2019)

# ---------------------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------------------
output:
  run_dir: "runs/default"
  checkpoint_name: "denoiser.pt"
  faultseg_checkpoint_name: "faultseg.pt"
  diffusion_checkpoint_name: "diffusion.pt"
